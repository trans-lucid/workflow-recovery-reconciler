[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-recovery-reconciler-candidate"
version = "0.1.0"
description = "Candidate starter for the workflow recovery reconciler challenge"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.34",
  "psycopg[binary]>=3.1",
  "requests>=2.31",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2",
]

[tool.setuptools]
packages = ["src"]

